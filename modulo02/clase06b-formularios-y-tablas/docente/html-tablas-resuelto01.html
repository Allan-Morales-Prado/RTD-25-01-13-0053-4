<!DOCTYPE html>
<html lang="es">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Lista de Compras</title>
</head>

<body>
  <h1>Lista de Compras Semanal</h1>

  </table>
  <caption>Productos para la semana del 15 al 21 de marzo</caption>

  <thead>
    <tr>
      <th scope="col">Producto</th>
      <th scope="col">Cantidad</th>
      <th scope="col">Precio unitario</th>
      <th scope="col">Subtotal</th>
    </tr>
  </thead>

  <tbody>
    <tr>
      <th scope="row">Manzanas</th>
      <td>3 kg</td>
      <td>$1.500</td>
      <td>$4.500</td>
    </tr>
    <tr>
      <th scope="row">Leche</th>
      <td>4 litros</td>
      <td>$1.200</td>
      <td>$4.800</td>
    </tr>
    <tr>
      <th scope="row">Pan</th>
      <td>6 unidades</td>
      <td>$500</td>
      <td>$3.000</td>
    </tr>
    <tr>
      <th scope="row">Huevos</th>
      <td>2 docenas</td>
      <td>$2.000</td>
      <td>$4.000</td>
    </tr>
  </tbody>

  <tfoot>
    <tr>
      <th scope="row" colspan="3">Total</th>
      <td>$16.300</td>
    </tr>
  </tfoot>
  </table>
</body>

</html>
